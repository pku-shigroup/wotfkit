[project]
name = "wotfkit"
version = "0.1.0"
description = "Explicit, nonparaxial 3D weak-object transfer functions in JAX"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["jax>=0.10.2"]

[dependency-groups]
dev = ["pytest>=8.4", "matplotlib>=3.10", "numpy>=2.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wotf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
